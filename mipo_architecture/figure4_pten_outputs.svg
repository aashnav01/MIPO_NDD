          <text class="t-small" x="305.0" y="240" text-anchor="middle">rank among all variants (0 = lowest score)</text>
          <text class="t-ink" x="96" y="74" text-anchor="end">C124S</text>
          <line class="conn" x1="112.0" y1="70" x2="137.2" y2="70"/>
          <g><title>C124S activity: real measurement, rank 0.5 (score -4.90)</title><circle class="hit" cx="112.0" cy="70" r="12"/><circle class="meas" cx="112.0" cy="70" r="6"/></g>
          <g><title>C124S activity: MIPO prediction, rank 7.0 (μ -0.95)</title><circle class="hit" cx="137.2" cy="70" r="12"/><polygon class="pred" points="137.2,63 144.2,70 137.2,77 130.2,70"/></g>
          <text class="t-ink" x="96" y="114" text-anchor="end">G129E</text>
          <line class="conn" x1="110.3" y1="110" x2="187.5" y2="110"/>
          <g><title>G129E activity: real measurement, rank 0.1 (score -5.41)</title><circle class="hit" cx="110.3" cy="110" r="12"/><circle class="meas" cx="110.3" cy="110" r="6"/></g>
          <g><title>G129E activity: MIPO prediction, rank 19.9 (μ -0.81)</title><circle class="hit" cx="187.5" cy="110" r="12"/><polygon class="pred" points="187.5,103 194.5,110 187.5,117 180.5,110"/></g>
          <text class="t-ink" x="96" y="154" text-anchor="end">R130G</text>
          <line class="conn" x1="187.7" y1="150" x2="206.4" y2="150"/>
          <g><title>R130G activity: real measurement, rank 19.9 (score -2.14)</title><circle class="hit" cx="187.7" cy="150" r="12"/><circle class="meas" cx="187.7" cy="150" r="6"/></g>
          <g><title>R130G activity: MIPO prediction, rank 24.7 (μ -0.74)</title><circle class="hit" cx="206.4" cy="150" r="12"/><polygon class="pred" points="206.4,143 213.4,150 206.4,157 199.4,150"/></g>
          <text class="t-ink" x="96" y="194" text-anchor="end">K289E</text>
          <line class="conn" x1="412.6" y1="190" x2="468.1" y2="190"/>
          <g><title>K289E activity: real measurement, rank 77.6 (score 0.14)</title><circle class="hit" cx="412.6" cy="190" r="12"/><circle class="meas" cx="412.6" cy="190" r="6"/></g>
          <g><title>K289E activity: MIPO prediction, rank 91.8 (μ 0.41)</title><circle class="hit" cx="468.1" cy="190" r="12"/><polygon class="pred" points="468.1,183 475.1,190 468.1,197 461.1,190"/></g>
          <text class="t-title" x="640" y="30">Abundance (Matreyek 2021)</text>
          <line class="grid" x1="640.0" y1="48" x2="640.0" y2="206"/><text class="t-axis" x="640.0" y="222" text-anchor="middle">0</text>
          <line class="grid" x1="737.5" y1="48" x2="737.5" y2="206"/><text class="t-axis" x="737.5" y="222" text-anchor="middle">25</text>
          <line class="grid" x1="835.0" y1="48" x2="835.0" y2="206"/><text class="t-axis" x="835.0" y="222" text-anchor="middle">50</text>
          <line class="grid" x1="932.5" y1="48" x2="932.5" y2="206"/><text class="t-axis" x="932.5" y="222" text-anchor="middle">75</text>
          <line class="grid" x1="1030.0" y1="48" x2="1030.0" y2="206"/><text class="t-axis" x="1030.0" y="222" text-anchor="middle">100</text>
          <text class="t-small" x="835.0" y="240" text-anchor="middle">rank among all variants (0 = lowest score)</text>
          <text class="t-ink" x="626" y="74" text-anchor="end">C124S</text>
          <line class="conn" x1="983.4" y1="70" x2="663.8" y2="70"/>
