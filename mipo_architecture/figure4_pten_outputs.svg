          <g><title>K289E abundance: MIPO prediction, rank 93.5 (μ 0.83)</title><circle class="hit" cx="1004.7" cy="190" r="12"/><polygon class="pred" points="1004.7,183 1011.7,190 1004.7,197 997.7,190"/></g>
          <circle class="meas" cx="116" cy="262" r="6"/><text class="t-ink" x="130" y="266">real measurement (published experiment)</text>
          <polygon class="pred" points="410,255 417,262 410,269 403,262"/><text class="t-ink" x="425" y="266">our prediction (MIPO)</text>
