          <g><title>C124S abundance: MIPO prediction, rank 6.1 (μ -0.44)</title><circle class="hit" cx="663.8" cy="70" r="12"/><polygon class="pred" points="663.8,63 670.8,70 663.8,77 656.8,70"/></g>
          <text class="t-ink" x="626" y="114" text-anchor="end">G129E</text>
