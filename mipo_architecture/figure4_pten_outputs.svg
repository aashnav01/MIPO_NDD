          <g><title>R130G abundance: MIPO prediction, rank 18.1 (μ -0.28)</title><circle class="hit" cx="710.4" cy="150" r="12"/><polygon class="pred" points="710.4,143 717.4,150 710.4,157 703.4,150"/></g>
          <text class="t-ink" x="626" y="194" text-anchor="end">K289E</text>
          <line class="conn" x1="895.9" y1="190" x2="1004.7" y2="190"/>
